<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Validación de usuarios - Sagitario y Huehueteca</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.min.css">
  <style>

    :root{color-scheme:dark;--bg:#0b132c;--nav:#101a35;--panel:#1c2745;--panel2:#14213f;--line:#344466;--cyan:#00c9fa;--text:#f4f7ff;--muted:#9aafd8;--green:#35d7a0;--red:#ff8295}
    *{box-sizing:border-box}
    body{font-family:Inter,Segoe UI,Arial,sans-serif;margin:0;padding:0;max-width:none;background:var(--bg);color:var(--text);line-height:1.5}
    .topbar{background:linear-gradient(110deg,#101a34,#1b2647);border-bottom:1px solid var(--line);padding:19px max(24px,calc((100vw - 1250px)/2))}
    .topbar h1{font-size:clamp(21px,2.5vw,29px);margin:0;font-weight:750;letter-spacing:-.5px}
    .topbar p{margin:2px 0 0;color:var(--cyan);font-size:13px;font-weight:600}
    main{max-width:1250px;margin:30px auto;padding:0 22px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:22px;box-shadow:0 10px 28px #03091b30}
    .panel h2{font-size:17px;margin:0 0 22px;padding-bottom:15px;border-bottom:1px solid var(--line)}
    .panel h2::before{content:"◆";color:var(--cyan);margin-right:10px}
    .archivos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}
    .filebox{background:var(--panel2);border:1px dashed #51648e;border-radius:10px;padding:18px;transition:.2s}
    .filebox:focus-within,.filebox:hover{border-color:var(--cyan)}
    label{font-weight:650;display:block;margin-bottom:10px;color:#e6edff}
    input[type=file]{max-width:100%;width:100%;font:inherit;font-size:13px;color:var(--muted)}
    input[type=file]::file-selector-button{background:#24395f;border:1px solid #4d6692;border-radius:6px;color:white;padding:9px 12px;margin-right:12px;cursor:pointer}
    .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
    button,select{font:inherit;border-radius:8px;padding:10px 16px}
    button{background:var(--cyan);color:#07172d;border:1px solid var(--cyan);font-weight:750;cursor:pointer;transition:.2s}
    button:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
    button.secondary{background:#263b62;color:#e8f2ff;border-color:#47618d}
    button:disabled{opacity:.45;cursor:not-allowed}
    button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
    #mensaje{margin-top:15px;white-space:pre-line;color:var(--muted);font-size:14px}
    #mensaje.error{color:var(--red)}
    .resumen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-bottom:22px}
    .dato{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:17px 19px;color:var(--muted);font-size:13px}
    .dato strong{display:block;font-size:29px;color:white;margin-top:4px;line-height:1.3}
    .dato:nth-child(2) strong{color:var(--green)}
    .dato:nth-child(3) strong{color:var(--red)}
    .ok,.no{display:inline-block;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:800;letter-spacing:.3px}
    .ok{background:#123d3b;color:#70f0be}.no{background:#4c283e;color:#ffadbc}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:17px}
    .toolbar label{margin:0}.toolbar select{background:var(--panel2);color:var(--text);border:1px solid #52658b;min-width:200px}
    .tabla-contenedor{overflow-x:auto}
    table{width:100%!important}
    table.dataTable{border-collapse:separate!important;border-spacing:0!important}
    table.dataTable thead th{background:#14213f!important;color:#b8d0f8!important;border-bottom:2px solid var(--cyan)!important;padding:13px!important;white-space:nowrap}
    table.dataTable tbody tr{background:var(--panel)!important;color:var(--text)!important}
    table.dataTable tbody tr:hover{background:#26375c!important}
    table.dataTable tbody td{border-bottom:1px solid #354461!important;padding:12px!important}
    .dt-container,.dt-container .dt-info,.dt-container .dt-length,.dt-container .dt-search{color:var(--muted)!important}
    .dt-container input,.dt-container select{background:var(--panel2)!important;color:white!important;border:1px solid #53658a!important;border-radius:7px!important;padding:7px!important}
    .dt-container .dt-paging .dt-paging-button{color:#e5edff!important;border-radius:6px!important}
    .dt-container .dt-paging .dt-paging-button.current{background:#164a6b!important;color:white!important;border:1px solid var(--cyan)!important}
    @media(max-width:640px){main{margin:18px auto;padding:0 12px}.panel{padding:16px}.resumen{gap:8px}.dato{padding:12px 9px;font-size:11px}.dato strong{font-size:23px}}
  </style>
</head>
<body>
  <header class="topbar"><h1>🛡 SAP Access &amp; Structure Manager</h1><p>Validación de usuarios · RollOut III Sagitario / Huehueteca</p></header>
  <main>
  <section class="panel">
    <h2>Carga y comparación de archivos</h2>
    <div class="archivos">
      <div class="filebox"><label for="archivoDB">1. Base de datos: DB_SAGITARIO_HUEHUETECA.xlsx</label><input id="archivoDB" type="file" accept=".xlsx,.xls"></div>
      <div class="filebox"><label for="archivoUsuarios">2. Listado: LISTADO_USUARIOS_NUEVOS.xlsx</label><input id="archivoUsuarios" type="file" accept=".xlsx,.xls"></div>
    </div>
    <div class="actions"><button id="comparar">Comparar archivos</button>
    <button class="secondary" id="exportar" disabled>↓ Descargar resultados XLSX</button></div>
    <div id="mensaje" role="status"></div>
  </section>
  <section class="panel">
    <h2>Resultados de validación</h2>
    <div class="resumen">
      <div class="dato">Procesados<strong id="total">0</strong></div>
      <div class="dato">Encontrados<strong id="encontrados">0</strong></div>
      <div class="dato">No encontrados<strong id="noEncontrados">0</strong></div>
    </div>
    <div class="toolbar"><label for="filtro">Filtrar por estado</label>
    <select id="filtro"><option value="">Todos</option><option value="ENCONTRADO">Encontrados</option><option value="NO ENCONTRADO">No encontrados</option></select></div>
    <div class="tabla-contenedor">
      <table id="tabla" class="display">
        <thead><tr><th>Estado</th><th>Usuario</th><th>Nombre</th><th>Posición</th><th>Sociedad</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
  <script>
    // Normaliza encabezados: ignora tildes, espacios repetidos y mayúsculas.
    function normalizar(texto) {
      return String(texto ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .trim().toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().replace(/\s+/g, ' ');
    }

    // Evita diferencias entre códigos numéricos y códigos almacenados como texto.
    function codigo(valor) {
      return String(valor ?? '').trim().replace(/\.0$/, '');
    }

    function obtenerColumna(encabezados, opciones) {
      return encabezados.findIndex(c => {
        const encabezado = normalizar(c);
        return opciones.some(opcion => encabezado === opcion ||
          (opcion === 'id de usuario' && encabezado.startsWith('id de usuario')));
      });
    }

    async function leerExcel(archivo, columnasObligatorias) {
      const datos = await archivo.arrayBuffer();
      const libro = XLSX.read(datos, { type: 'array' });
      const hojas = [];
      for (const nombreHoja of libro.SheetNames) {
        const filas = XLSX.utils.sheet_to_json(libro.Sheets[nombreHoja], {
          header: 1, defval: '', raw: false
        });
        // Busca encabezados en las primeras 20 filas de cada hoja.
        for (let i = 0; i < Math.min(filas.length, 20); i++) {
          const indices = columnasObligatorias.map(opciones => obtenerColumna(filas[i], opciones));
          if (indices.every(indice => indice >= 0)) {
            hojas.push({ nombreHoja, filas: filas.slice(i + 1), encabezados: filas[i] });
            break;
          }
        }
      }
      if (!hojas.length) throw new Error('No se encontraron las columnas esperadas en ' + archivo.name);
      return hojas;
    }

    const columnasDB = {
      usuario: ['id de usuario', 'usuario', 'codigo de usuario', 'codigo usuario'],
      nombre: ['nombre completo', 'nombre'],
      posicion: ['posicion', 'puesto'],
      sociedad: ['sociedad descripcion', 'sociedad']
    };
    const columnasListado = {
      usuario: ['usuario', 'id de usuario', 'codigo de usuario', 'codigo usuario'],
      nombre: ['nombre', 'nombre completo']
    };

    function convertirHojas(hojas, definicion) {
      const registros = [];
      for (const hoja of hojas) {
        const indices = Object.fromEntries(Object.entries(definicion).map(
          ([clave, opciones]) => [clave, obtenerColumna(hoja.encabezados, opciones)]
        ));
        for (const fila of hoja.filas) {
          const usuario = codigo(fila[indices.usuario]);
          if (!usuario) continue;
          const registro = { usuario };
          for (const campo of Object.keys(definicion)) {
            if (campo !== 'usuario') {
              registro[campo] = indices[campo] >= 0 ? String(fila[indices[campo]] ?? '').trim() : '';
            }
          }
          registros.push(registro);
        }
      }
      return registros;
    }

    const tabla = new DataTable('#tabla', {
      data: [],
      columns: [
        { data: 'estado', render: (dato, tipo) => tipo === 'display'
          ? (dato === 'ENCONTRADO' ? '<span class="ok">ENCONTRADO</span>' : '<span class="no">NO ENCONTRADO</span>') : dato },
        { data: 'usuario' }, { data: 'nombre' }, { data: 'posicion' }, { data: 'sociedad' }
      ],
      pageLength: 25,
      order: [],
      language: { url: 'https://cdn.datatables.net/plug-ins/2.1.8/i18n/es-ES.json' }
    });

    let resultados = [];
    const mensaje = document.getElementById('mensaje');

    document.getElementById('comparar').addEventListener('click', async () => {
      const archivoDB = document.getElementById('archivoDB').files[0];
      const archivoUsuarios = document.getElementById('archivoUsuarios').files[0];
      if (!archivoDB || !archivoUsuarios) {
        mensaje.classList.add('error');
         mensaje.textContent = 'Selecciona los dos archivos Excel antes de comparar.';
        return;
      }
      document.getElementById('exportar').disabled = true;
      mensaje.classList.remove('error');
       mensaje.textContent = 'Procesando archivos...';
      try {
        const [hojasDB, hojasUsuarios] = await Promise.all([
          leerExcel(archivoDB, [columnasDB.usuario, columnasDB.posicion, columnasDB.sociedad]),
          leerExcel(archivoUsuarios, [columnasListado.usuario])
        ]);
        const db = convertirHojas(hojasDB, columnasDB);
        const usuarios = convertirHojas(hojasUsuarios, columnasListado);
        const indiceDB = new Map();
        for (const registro of db) {
          // Si hay duplicados, conserva el primero encontrado en la base.
          if (!indiceDB.has(registro.usuario)) indiceDB.set(registro.usuario, registro);
        }
        resultados = usuarios.map(persona => {
          const encontrado = indiceDB.get(persona.usuario);
          return {
            estado: encontrado ? 'ENCONTRADO' : 'NO ENCONTRADO',
            usuario: persona.usuario,
            nombre: encontrado?.nombre || persona.nombre || 'No disponible',
            posicion: encontrado?.posicion || 'No disponible',
            sociedad: encontrado?.sociedad || 'No disponible'
          };
        });
        tabla.clear().rows.add(resultados).draw();
        document.getElementById('filtro').value = '';
        tabla.column(0).search('').draw();
        const encontrados = resultados.filter(r => r.estado === 'ENCONTRADO').length;
        document.getElementById('total').textContent = resultados.length;
        document.getElementById('encontrados').textContent = encontrados;
        document.getElementById('noEncontrados').textContent = resultados.length - encontrados;
        document.getElementById('exportar').disabled = resultados.length === 0;
        mensaje.textContent = 'Comparación finalizada. Se conservaron todas las filas del listado de usuarios.';
      } catch (error) {
        mensaje.classList.add('error');
         mensaje.textContent = 'Error: ' + error.message;
        console.error(error);
      }
    });

    document.getElementById('filtro').addEventListener('change', event => {
      tabla.column(0).search(event.target.value ? '^' + event.target.value + '$' : '', true, false).draw();
    });

    document.getElementById('exportar').addEventListener('click', () => {
      if (!resultados.length) return;
      // Exporta el filtro activo, respetando el orden visible.
      const visibles = tabla.rows({ search: 'applied', order: 'applied' }).data().toArray();
      const filas = visibles.map(r => ({
        Estado: r.estado, Usuario: r.usuario, Nombre: r.nombre,
        'Posición': r.posicion, Sociedad: r.sociedad
      }));
      const hoja = XLSX.utils.json_to_sheet(filas);
      hoja['!cols'] = [{ wch: 18 }, { wch: 17 }, { wch: 42 }, { wch: 34 }, { wch: 45 }];
      const libro = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(libro, hoja, 'Validación');
      XLSX.writeFile(libro, 'RESULTADO_VALIDACION_USUARIOS.xlsx');
    });
  </script>
</body>
</html>
