<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Matriz de Roles vs Usuarios - Full Audit</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #0b1320; color: #d1d9e6; }
        .container { padding: 30px; }
        h2 { color: #89a1c4; border-bottom: 2px solid #1a2a40; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background-color: #0f1c2e; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        th, td { border: 1px solid #1a2a40; padding: 10px; text-align: center; }
        th { background-color: #16263d; color: #ffffff; font-size: 13px; }
        tr:nth-child(even) { background-color: #122033; }
        
        .naranja { background-color: #d97706 !important; color: #ffffff; font-weight: bold; }
        .rosa { background-color: #db2777 !important; color: #ffffff; font-weight: bold; }
        
        input[type="file"] { background: #16263d; padding: 8px; border-radius: 4px; color: white; border: 1px solid #2a4a75; }
        .button { padding: 12px 25px; margin-right: 10px; cursor: pointer; background: #2a4a75; color: white; border: none; border-radius: 4px; font-weight: bold; }
        .button:hover { background: #3d6a9e; }
        .btn-excel { background: #2a6363; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Matriz de Roles vs Usuarios (Full Audit Mode)</h2>
        <p>1. Cargar DBROLES: <input type="file" id="fileRoles" accept=".xlsx" /></p>
        <p>2. Cargar RLUSUARIOS: <input type="file" id="fileUsuarios" accept=".xlsx" /></p>
        <button class="button" onclick="procesarCruce()">Generar Matriz</button>
        <button class="button btn-excel" onclick="exportarExcel()">Descargar Excel</button>
        <div id="resultado" style="overflow-x: auto;"></div>
    </div>

    <script>
        let matrizFinal = [];
        let rolesParaMarcarNaranja = new Set();
        let rolesParaMarcarRosa = new Set();

        async function procesarCruce() {
            const fRoles = document.getElementById('fileRoles').files[0];
            const fUsers = document.getElementById('fileUsuarios').files[0];
            if (!fRoles || !fUsers) return alert("Por favor carga ambos archivos");

            const rolesData = await leerExcel(fRoles);
            const usersData = await leerExcel(fUsers);

            // 1. Identificar repetidos y roles con visualización
            let conteoRoles = {};
            let mapaBase = {};
            rolesData.forEach(r => {
                // Conteo para duplicados
                conteoRoles[r.ROL] = (conteoRoles[r.ROL] || 0) + 1;
                
                // Análisis para naranja
                let desc = r.DESCRIPCION || "";
                let esVisual = /visuali[sz]a/i.test(desc);
                let nombreBase = desc.replace(/\(.*\)/i, "").trim();
                if (!mapaBase[nombreBase]) mapaBase[nombreBase] = { tieneVisual: false };
                if (esVisual) mapaBase[nombreBase].tieneVisual = true;
            });

            rolesParaMarcarNaranja = new Set();
            rolesParaMarcarRosa = new Set();

            rolesData.forEach(r => {
                // Si está repetido (conteo > 1)
                if (conteoRoles[r.ROL] > 1) rolesParaMarcarRosa.add(r.ROL);
                
                // Si es ejecución y tiene visual
                let desc = r.DESCRIPCION || "";
                let esVisual = /visuali[sz]a/i.test(desc);
                let nombreBase = desc.replace(/\(.*\)/i, "").trim();
                if (!esVisual && mapaBase[nombreBase].tieneVisual) {
                    rolesParaMarcarNaranja.add(r.ROL);
                }
            });

            // Resto de la lógica...
            let relacionUsuarioRol = {};
            usersData.forEach(u => { relacionUsuarioRol[`${u.Usuario}_${u.Rol}`] = true; });

            let usuariosUnicos = {};
            usersData.forEach(u => { usuariosUnicos[u.Usuario] = u['Nombre completo']; });
            let listaUsuarios = Object.keys(usuariosUnicos).map(id => `${id} - ${usuariosUnicos[id]}`);

            matrizFinal = rolesData.map(r => {
                let fila = { ROL: r.ROL, DESCRIPCION: r.DESCRIPCION };
                Object.keys(usuariosUnicos).forEach(id => {
                    let key = `${id}_${r.ROL}`;
                    fila[`${id} - ${usuariosUnicos[id]}`] = relacionUsuarioRol[key] ? 1 : 0;
                });
                return fila;
            });

            renderTable(matrizFinal, listaUsuarios);
        }

        function leerExcel(file) {
            return new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = e => {
                    const data = new Uint8Array(e.target.result);
                    const wb = XLSX.read(data, {type: 'array'});
                    resolve(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]));
                };
                reader.readAsArrayBuffer(file);
            });
        }

        function renderTable(data, usuarios) {
            let html = "<table><tr><th>ROL</th><th>DESCRIPCION</th>";
            usuarios.forEach(u => html += `<th>${u}</th>`);
            html += "<th>OBSERVACION</th></tr>";
            
            data.forEach(r => {
                let clase = rolesParaMarcarNaranja.has(r.ROL) ? 'class="naranja"' : (rolesParaMarcarRosa.has(r.ROL) ? 'class="rosa"' : '');
                let obs = rolesParaMarcarNaranja.has(r.ROL) ? "REVISAR: Existe visual" : (rolesParaMarcarRosa.has(r.ROL) ? "ERROR: ROL DUPLICADO" : "OK");
                
                html += `<tr><td ${clase}>${r.ROL}</td><td ${clase}>${r.DESCRIPCION}</td>`;
                usuarios.forEach(u => html += `<td>${r[u]}</td>`);
                html += `<td ${clase}>${obs}</td></tr>`;
            });
            html += "</table>";
            document.getElementById('resultado').innerHTML = html;
        }

        function exportarExcel() {
            if (matrizFinal.length === 0) return alert("Genera la matriz primero");
            let datosParaExcel = matrizFinal.map(fila => {
                let nuevaFila = { ...fila };
                nuevaFila["OBSERVACION"] = rolesParaMarcarNaranja.has(fila.ROL) ? "REVISAR: Existe visual" : (rolesParaMarcarRosa.has(fila.ROL) ? "ERROR: ROL DUPLICADO" : "OK");
                return nuevaFila;
            });
            const ws = XLSX.utils.json_to_sheet(datosParaExcel);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "MatrizUsuarios");
            XLSX.writeFile(wb, "Matriz_Roles_Usuarios_Auditado.xlsx");
        }
    </script>
</body>
</html>
