<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Matriz de Roles Pro - Auditoría SAP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #0b1320; color: #d1d9e6; }
        .container { padding: 30px; }
        h2 { color: #89a1c4; border-bottom: 2px solid #1a2a40; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background-color: #0f1c2e; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        th, td { border: 1px solid #1a2a40; padding: 10px; text-align: center; white-space: nowrap; }
        th { background-color: #16263d; color: #ffffff; font-size: 12px; position: sticky; top: 0; }
        tr:nth-child(even) { background-color: #122033; }
        .naranja { background-color: #d97706 !important; color: #ffffff !important; }
        .rosa { background-color: #db2777 !important; color: #ffffff !important; }
        input[type="file"] { background: #16263d; padding: 8px; border-radius: 4px; color: white; border: 1px solid #2a4a75; }
        .button { padding: 12px 25px; cursor: pointer; background: #2a4a75; color: white; border: none; border-radius: 4px; font-weight: bold; margin-top: 10px; }
        .button:hover { background: #3d6a9e; }
        .btn-excel { background: #2a6363; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Matriz de Roles vs Usuarios (Columnas de Auditoría al Final)</h2>
        <div style="background: #16263d; padding: 15px; border-radius: 8px;">
            <p>1. Cargar DBROLES: <input type="file" id="fileRoles" accept=".xlsx" /></p>
            <p>2. Cargar RLUSUARIOS: <input type="file" id="fileUsuarios" accept=".xlsx" /></p>
            <button class="button" onclick="procesarCruce()">Generar Matriz</button>
            <button class="button btn-excel" onclick="exportarExcel()">Descargar Excel</button>
        </div>
        <div id="resultado" style="overflow-x: auto; margin-top: 20px;"></div>
    </div>

    <script>
        let matrizFinal = [];
        let rolesAudit = {};
        let listaUsuariosHeaders = [];

        function normalizarTexto(txt) {
            if (!txt) return "";
            return txt.toString()
                .replace(/\s+/g, ' ')
                .replace(/-\s+/g, '-')
                .replace(/\s+-/g, '-')
                .replace(/,\s+/g, ',')
                .trim()
                .toLowerCase();
        }

        function obtenerBase(desc) {
            let limpia = normalizarTexto(desc);
            return limpia.replace(/\s*\(?visuali[sz]a(r|ción)\)?/gi, "").trim();
        }

        async function procesarCruce() {
            const fRoles = document.getElementById('fileRoles').files[0];
            const fUsers = document.getElementById('fileUsuarios').files[0];
            if (!fRoles || !fUsers) return alert("Carga ambos archivos");

            const rolesData = await leerExcel(fRoles);
            const usersData = await leerExcel(fUsers);

            let grupos = {}; 
            rolesAudit = {};

            rolesData.forEach(r => {
                let desc = r.DESCRIPCION || "";
                let esVisual = /visuali[sz]a/i.test(desc);
                let base = obtenerBase(desc);
                let tipo = esVisual ? 'VISUAL' : 'EJECUCION';
                if (!grupos[base]) grupos[base] = { VISUAL: [], EJECUCION: [] };
                grupos[base][tipo].push(r.ROL);
            });

            rolesData.forEach(r => {
                let desc = r.DESCRIPCION || "";
                let base = obtenerBase(desc);
                let esVisual = /visuali[sz]a/i.test(desc);
                let obs = "OK", color = "", duplicado = "NO";

                if (grupos[base][esVisual ? 'VISUAL' : 'EJECUCION'].length > 1) {
                    duplicado = "SI";
                    color = "rosa";
                }
                if (!esVisual && grupos[base].VISUAL.length > 0) {
                    obs = "Revisar: Existe visual (" + grupos[base].VISUAL.join(", ") + ")";
                    color = "naranja";
                }
                rolesAudit[r.ROL] = { obs, duplicado, color };
            });

            let relacionUsuarioRol = {};
            let usuariosUnicos = {};
            usersData.forEach(u => {
                let uID = u.Usuario ? u.Usuario.toString().trim() : "N/A";
                relacionUsuarioRol[`${uID}_${u.Rol}`] = true;
                usuariosUnicos[uID] = u['Nombre completo'] || "Sin Nombre";
            });

            listaUsuariosHeaders = Object.keys(usuariosUnicos).map(id => `${id} - ${usuariosUnicos[id]}`);

            matrizFinal = rolesData.map(r => {
                let fila = { ROL: r.ROL, DESCRIPCION: r.DESCRIPCION };
                Object.keys(usuariosUnicos).forEach(id => {
                    fila[`${id} - ${usuariosUnicos[id]}`] = relacionUsuarioRol[`${id}_${r.ROL}`] ? 1 : 0;
                });
                return fila;
            });

            renderTable(matrizFinal, listaUsuariosHeaders);
        }

        function leerExcel(file) {
            return new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = e => {
                    const data = new Uint8Array(e.target.result);
                    const wb = XLSX.read(data, {type: 'array'});
                    resolve(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]));
                };
                reader.readAsArrayBuffer(file);
            });
        }

        function renderTable(data, usuarios) {
            let html = "<table><tr><th>ROL</th><th>DESCRIPCION</th>";
            usuarios.forEach(u => html += `<th>${u}</th>`);
            html += "<th>OBSERVACION</th><th>DUPLICADO</th></tr>";

            data.forEach(r => {
                let audit = rolesAudit[r.ROL];
                html += `<tr class="${audit.color}">
                            <td>${r.ROL}</td>
                            <td style="text-align:left">${r.DESCRIPCION}</td>`;
                usuarios.forEach(u => html += `<td>${r[u] === 1 ? '1' : '0'}</td>`);
                html += `<td>${audit.obs}</td><td>${audit.duplicado}</td></tr>`;
            });
            html += "</table>";
            document.getElementById('resultado').innerHTML = html;
        }

        function exportarExcel() {
            if (matrizFinal.length === 0) return alert("Genera la matriz primero");
            
            // Re-ordenamiento manual para asegurar que auditoría vaya al final
            let exportData = matrizFinal.map(fila => {
                let audit = rolesAudit[fila.ROL];
                let filaOrdenada = {};
                
                // 1. Columnas Base
                filaOrdenada["ROL"] = fila.ROL;
                filaOrdenada["DESCRIPCION"] = fila.DESCRIPCION;
                
                // 2. Columnas Dinámicas (Usuarios)
                listaUsuariosHeaders.forEach(u => {
                    filaOrdenada[u] = fila[u];
                });
                
                // 3. Columnas de Auditoría (AL FINAL)
                filaOrdenada["OBSERVACION"] = audit.obs;
                filaOrdenada["DUPLICADO"] = audit.duplicado;
                
                return filaOrdenada;
            });

            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "MatrizAuditada");
            XLSX.writeFile(wb, "Matriz_Roles_Final.xlsx");
        }
    </script>
</body>
</html>
