<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Limpiador de DBROLES</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #0b1320; color: #d1d9e6; }
        .container { background: #0f1c2e; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; color: #d1d9e6; }
        th, td { border: 1px solid #1a2a40; padding: 8px; text-align: left; }
        th { background-color: #16263d; color: #ffffff; }
        .naranja { background-color: #d97706 !important; color: #ffffff; font-weight: bold; }
        .button { padding: 10px 15px; margin-top: 10px; cursor: pointer; background: #2a4a75; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Limpiador de DBROLES</h2>
        <input type="file" id="input" accept=".xlsx, .xls" />
        <button class="button" onclick="procesarDatos()">Procesar Archivo</button>
        <button class="button" onclick="exportarExcel()" style="background: #2a6363;">Exportar a Excel (.xlsx)</button>
        <div id="resultado"></div>
    </div>

    <script>
        let datosProcesados = [];

        function procesarDatos() {
            const fileInput = document.getElementById('input');
            const file = fileInput.files[0];
            if (!file) return alert("Por favor selecciona un archivo");

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(sheet);

                // 1. Mapeo para identificar si existe versión visual
                let mapaRoles = {};
                json.forEach(row => {
                    let desc = row.DESCRIPCION || "";
                    let esVisual = /visuali[sz]a/i.test(desc);
                    let nombreBase = desc.replace(/\(.*\)/i, "").trim();
                    if (!mapaRoles[nombreBase]) mapaRoles[nombreBase] = { tieneVisual: false };
                    if (esVisual) mapaRoles[nombreBase].tieneVisual = true;
                });

                // 2. Procesar datos con columna de ESTADO clara
                let rolesVistos = {};
                datosProcesados = json.map(row => {
                    let desc = row.DESCRIPCION || "";
                    let esVisual = /visuali[sz]a/i.test(desc);
                    let nombreBase = desc.replace(/\(.*\)/i, "").trim();
                    
                    let esDuplicado = rolesVistos[row.ROL] ? true : false;
                    rolesVistos[row.ROL] = true;
                    
                    let necesitaRevision = (!esVisual && mapaRoles[nombreBase].tieneVisual);
                    
                    return { 
                        ROL: row.ROL,
                        DESCRIPCION: row.DESCRIPCION,
                        ESTADO: necesitaRevision ? "REVISAR: Existe visual" : (esDuplicado ? "DUPLICADO" : "OK")
                    };
                });

                renderTable(datosProcesados);
            };
            reader.readAsArrayBuffer(file);
        }

        function renderTable(data) {
            let html = "<table><tr><th>ROL</th><th>DESCRIPCION</th><th>ESTADO</th></tr>";
            data.forEach(row => {
                let clase = row.ESTADO.startsWith("REVISAR") ? 'class="naranja"' : '';
                html += `<tr ${clase}><td>${row.ROL}</td><td>${row.DESCRIPCION}</td><td>${row.ESTADO}</td></tr>`;
            });
            html += "</table>";
            document.getElementById('resultado').innerHTML = html;
        }

        function exportarExcel() {
            if (datosProcesados.length === 0) return alert("Procesa datos primero");
            const ws = XLSX.utils.json_to_sheet(datosProcesados);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "RolesLimpios");
            XLSX.writeFile(wb, "Roles_DBROLES_Procesados.xlsx");
        }
    </script>
</body>
</html>
