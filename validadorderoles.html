<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Validador de Roles RLS - Auditoría</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-900 p-8 text-gray-100">
    <div class="max-w-6xl mx-auto bg-gray-800 rounded-xl shadow-2xl border border-gray-700 overflow-hidden">
        <header class="bg-gray-700 p-8 border-b border-gray-600">
            <h1 class="text-3xl font-bold text-white">Validador de Roles RLS</h1>
            <p class="text-gray-400">Auditoría cruzada: Roles vs Usuarios</p>
        </header>

        <div class="p-8 grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="space-y-4">
                <label class="block text-sm font-bold uppercase text-gray-400">Mandante:</label>
                <select id="mandante" class="w-full p-3 bg-gray-900 border border-gray-600 rounded">
                    <option value="S4P">S4P</option>
                    <option value="S4D">S4D</option>
                    <option value="S4Q">S4Q</option>
                    <option value="SAQ">SAQ</option>
                    <option value="SAD">SAD</option>
                    <option value="CNP">CNP</option>
                    <option value="FOP">FOP</option>
                    <option value="EWP">EWP</option>
                    <option value="PTM">PTM</option>
                    <option value="FOC">FOC</option>
                    <option value="FOV">FOV</option>
                    <option value="FOQ">FOQ</option>
                    <option value="EWC">EWC</option>
                    <option value="DPP">DPP</option>
                </select>

                <label class="block text-sm font-bold uppercase text-gray-400">Cargar Archivo (RLUSUARIO):</label>
                <input type="file" id="upload" class="w-full p-2 bg-gray-900 border border-gray-600 rounded">
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-bold uppercase text-gray-400">Roles solicitados previamente los cuales es necesario validar (uno por línea):</label>
                <textarea id="rolesArea" class="w-full h-48 p-4 bg-gray-900 border border-gray-600 rounded font-mono text-blue-300"></textarea>
            </div>
        </div>

        <div class="px-8 pb-8 flex gap-4">
            <button onclick="procesar()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded font-bold transition">Validar Auditoría</button>
            <button onclick="exportarExcel()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white py-4 rounded font-bold transition">Descargar Reporte (.xlsx)</button>
        </div>

        <div id="resultadoContainer" class="p-8 hidden overflow-x-auto">
            <table class="w-full text-sm text-left border border-gray-700">
                <thead class="bg-gray-900 text-gray-300 uppercase text-xs">
                    <tr>
                        <th class="p-3">Mandante</th>
                        <th class="p-3">Usuario</th>
                        <th class="p-3">Nombre Completo</th>
                        <th class="p-3">Rol Solicitado</th>
                        <th class="p-3">Descripción del Rol</th>
                        <th class="p-3">Estado</th>
                    </tr>
                </thead>
                <tbody id="tablaBody" class="divide-y divide-gray-700 bg-gray-800"></tbody>
            </table>
        </div>
    </div>

    <script>
        let datosProduccion = [];
        document.getElementById('upload').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const wb = XLSX.read(e.target.result, {type: 'array'});
                datosProduccion = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                alert("Archivo cargado con " + datosProduccion.length + " filas.");
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        });

        function procesar() {
            const mandante = document.getElementById('mandante').value;
            const rolesSolicitados = document.getElementById('rolesArea').value.split('\n').map(r => r.trim()).filter(r => r !== "");
            const tbody = document.getElementById('tablaBody');
            tbody.innerHTML = "";

            // Crear un mapa único de usuarios y sus nombres
            // Y un mapa para extraer la descripción breve de cada rol del archivo
            const usuariosInfo = {};
            const rolesDescripcion = {};

            datosProduccion.forEach(item => {
                if (!usuariosInfo[item.Usuario]) {
                    usuariosInfo[item.Usuario] = item['Nombre completo'];
                }
                
                // Mapeamos el nombre del Rol con su Descripción Breve
                if (item.Rol && !rolesDescripcion[String(item.Rol).trim()]) {
                    rolesDescripcion[String(item.Rol).trim()] = item['Descripción breve del rol'] || item['Descripcion breve del rol'] || "";
                }
            });

            const usuariosUnicos = Object.keys(usuariosInfo);

            usuariosUnicos.forEach(usuario => {
                const nombre = usuariosInfo[usuario];
                const rolesDelUsuario = datosProduccion
                    .filter(item => String(item.Usuario) === usuario)
                    .map(item => String(item.Rol).trim());

                rolesSolicitados.forEach(rolSolicitado => {
                    const tieneRol = rolesDelUsuario.includes(rolSolicitado);
                    // Obtener la descripción guardada en el mapa, si no existe coloca vacío o 'No encontrado'
                    const descripcionRol = rolesDescripcion[rolSolicitado] || "";
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="p-3">${mandante}</td>
                        <td class="p-3">${usuario}</td>
                        <td class="p-3">${nombre}</td>
                        <td class="p-3 font-mono">${rolSolicitado}</td>
                        <td class="p-3 text-gray-300">${descripcionRol}</td>
                        <td class="p-3 font-bold ${tieneRol ? 'text-emerald-400' : 'text-red-500'}">
                            ${tieneRol ? 'APLICADO' : 'NO APLICADO'}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
            document.getElementById('resultadoContainer').classList.remove('hidden');
        }

        function exportarExcel() {
            const wb = XLSX.utils.table_to_book(document.querySelector('table'));
            XLSX.writeFile(wb, "Reporte_Auditoria_Roles.xlsx");
        }
    </script>
</body>
</html>
